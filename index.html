<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bron Service Menu</title>
    <style>
        :root {
            --accent: 0, 255, 120;
            --accent-soft: rgba(0, 255, 120, 0.14);
            --panel: rgba(12, 12, 14, 0.94);
            --panel-alpha: 0.94;
            --panel-border: rgba(255, 255, 255, 0.07);
            --text-dim: #9a9aa3;
            --item-h: 42px;
        }

        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            height: 100vh;
            padding: 36px;
            overflow: hidden;
            color: #fff;
        }

        /* Hafif vignette: arkadaki oyunu biraz öne çıkarır */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, transparent 40%, rgba(0, 0, 0, 0.25) 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* ---------- Ana Konteyner ---------- */
        .menu-wrapper {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: menuSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .menu-wrapper.hidden {
            display: none;
        }

        @keyframes menuSlideIn {
            from { opacity: 0; transform: translateY(-16px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .menu-container {
            position: relative;
            width: 100%;
            background: rgba(12, 12, 14, var(--panel-alpha));
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
        }

        /* Üst kenarda accent parıltısı */
        .menu-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent), 0.6), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* ---------- Banner ---------- */
        .menu-banner-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #0b0b0d;
        }

        .menu-banner {
            position: absolute;
            inset: 0;
            background: url('https://media.discordapp.net/attachments/1563900451223502988/1563969902665015476/image.png?ex=6adf8ff9&is=6ade3e79&hm=c718da4c52081b773d091b4029b7e887a0587dbdb574e8f1c803abebd4ff0996&=&format=webp&quality=lossless') center/cover no-repeat;
            animation: bannerPulse 14s infinite alternate ease-in-out;
        }

        /* Çift gradient: üstte hafif, altta güçlü karartma + sağ üst accent glow */
        .menu-banner-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(var(--accent), 0.28), transparent 60%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0) 30%),
                linear-gradient(to top, rgba(12, 12, 14, var(--panel-alpha)) 0%, rgba(12, 12, 14, 0.55) 40%, rgba(0, 0, 0, 0.1) 100%);
            pointer-events: none;
        }

        /* Film grain: ince yatay çizgi overlay */
        .banner-grain {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.5) 0 1px, transparent 1px 3px);
            opacity: 0.06;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        @keyframes bannerPulse {
            from { transform: scale(1); }
            to   { transform: scale(1.07); }
        }

        .banner-title {
            position: absolute;
            left: 18px;
            bottom: 14px;
            z-index: 2;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .banner-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background: rgb(var(--accent));
            margin-top: 6px;
            box-shadow: 0 0 8px rgba(var(--accent), 0.6);
        }

        .banner-title small {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }

        /* Banner altında animasyonlu accent çizgisi */
        .banner-scanline {
            position: relative;
            height: 1px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
        }

        .banner-scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(var(--accent), 0.8), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ---------- Kategori Başlığı ---------- */
        .menu-category-box {
            padding: 12px 14px 8px;
            background: rgba(12, 12, 14, var(--panel-alpha));
        }

        .category-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(var(--accent), 0.12);
            color: rgb(var(--accent));
            font-weight: 700;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(var(--accent), 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .category-btn::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgb(var(--accent));
            box-shadow: 0 0 8px rgb(var(--accent));
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px rgb(var(--accent)); }
            50% { opacity: 0.4; box-shadow: 0 0 4px rgb(var(--accent)); }
        }

        /* ---------- Liste ---------- */
        .menu-viewport {
            position: relative;
            overflow-y: auto;
            max-height: 420px;
            padding: 4px 8px 8px;
            scrollbar-width: none;
        }

        .menu-viewport::-webkit-scrollbar {
            display: none;
        }

        .menu-items {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .slide-right { animation: slideRightAnim 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .slide-left  { animation: slideLeftAnim  0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @keyframes slideRightAnim {
            from { transform: translateX(24px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        @keyframes slideLeftAnim {
            from { transform: translateX(-24px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }

        /* Kayan imleç */
        .gliding-cursor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--item-h);
            background: linear-gradient(90deg, rgba(var(--accent), 0.18), rgba(var(--accent), 0.04));
            border: 1px solid rgba(var(--accent), 0.55);
            border-radius: 8px;
            pointer-events: none;
            transition: transform 0.18s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1;
            box-shadow: 0 0 24px rgba(var(--accent), 0.35), inset 0 0 16px rgba(var(--accent), 0.1);
        }

        .gliding-cursor::before {
            content: "";
            position: absolute;
            left: -1px;
            top: 8px;
            bottom: 8px;
            width: 4px;
            border-radius: 3px;
            background: rgb(var(--accent));
            box-shadow: 0 0 8px rgb(var(--accent));
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--item-h);
            padding: 0 14px;
            font-size: 13.5px;
            color: #c9c9d0;
            position: relative;
            z-index: 2;
            transition: color 0.15s ease;
        }

        .menu-item:hover {
            color: #fff;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.7;
            transition: opacity 0.15s ease, fill 0.15s ease;
        }

        .menu-item .arrow {
            font-size: 14px;
            color: #6d6d78;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .menu-item.active {
            color: #fff;
            font-weight: 600;
        }

        .menu-item.active svg {
            opacity: 1;
            fill: rgb(var(--accent));
        }

        .menu-item.active .arrow {
            color: rgb(var(--accent));
            transform: translateX(3px);
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .toggle-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #777;
            background: rgba(255, 255, 255, 0.03);
        }

        .toggle-badge.on {
            color: rgb(var(--accent));
            border-color: rgba(var(--accent), 0.45);
            background: rgba(var(--accent), 0.1);
        }

        .slider-value {
            font-size: 11.5px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .menu-item.active .slider-value {
            color: rgb(var(--accent));
        }

        .color-swatch {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* ---------- Renk seçici overlay ---------- */
        .color-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }

        .color-overlay input[type="color"] {
            width: 140px;
            height: 90px;
            border: none;
            background: none;
            cursor: pointer;
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            pointer-events: none;
        }

        .toast {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 3px solid #888;
            color: #ddd;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .toast.on {
            color: rgb(var(--accent));
            border-left-color: rgb(var(--accent));
        }

        .toast.off {
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        .toast.info {
            color: #ddd;
            border-left-color: #888;
        }

        .toast.out {
            animation: toastOut 0.3s ease both;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(16px) scale(0.96); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateX(16px); }
        }

        /* ---------- Oyuncu listesi overlay ---------- */
        .list-overlay {
            position: fixed;
            top: 36px;
            left: 452px;
            width: 300px;
            max-height: calc(100vh - 72px);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 90;
        }

        .list-overlay.open {
            display: flex;
        }

        .list-header {
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgb(var(--accent));
            border-bottom: 1px solid var(--panel-border);
        }

        .list-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            scrollbar-width: none;
        }

        .list-body::-webkit-scrollbar {
            display: none;
        }

        .player-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 10px;
            font-size: 13px;
            color: #c9c9d0;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .player-entry:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .player-entry.selected {
            background: rgba(var(--accent), 0.14);
            border: 1px solid rgba(var(--accent), 0.4);
        }

        .player-entry .pid {
            color: rgb(var(--accent));
            font-weight: 700;
            margin-right: 8px;
            font-variant-numeric: tabular-nums;
        }

        .player-entry .pdist {
            font-size: 11px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        .player-empty {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ---------- Input overlay (koordinat + tuş) ---------- */
        .input-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 95;
        }

        .input-overlay.open {
            display: flex;
        }

        .input-box {
            width: 280px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .input-box h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgb(var(--accent));
            margin-bottom: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row label {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 4px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .input-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: #fff;
            border-radius: 6px;
            padding: 7px 8px;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        .input-box input:focus {
            border-color: rgba(var(--accent), 0.6);
        }

        .input-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.05);
            color: #ddd;
        }

        .btn.primary {
            background: rgba(var(--accent), 0.15);
            border-color: rgba(var(--accent), 0.5);
            color: rgb(var(--accent));
        }

        /* ---------- Alt Footer ---------- */
        .menu-footer {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 9px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--panel-border);
        }

        .footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .footer-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 900;
            color: #000;
            background: rgb(var(--accent));
            box-shadow: 0 0 14px rgba(var(--accent), 0.6);
        }

        .footer-breadcrumb {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer-breadcrumb .cur {
            color: #fff;
            font-weight: 600;
            border-bottom: 1px solid rgba(var(--accent), 0.5);
            padding-bottom: 1px;
        }

        .footer-hint {
            font-size: 10px;
            color: #6d6d78;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .footer-hint kbd {
            font-family: inherit;
            font-size: 9.5px;
            color: #ddd;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .footer-counter {
            font-size: 11.5px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        .footer-counter span {
            color: #fff;
            font-weight: 600;
        }

        /* ---------- Açıklama Kutusu ---------- */
        .menu-description {
            width: 100%;
            background:
                radial-gradient(circle at top right, rgba(var(--accent), 0.12), transparent 50%),
                rgba(12, 12, 14, var(--panel-alpha));
            padding: 12px 16px;
            font-size: 12.5px;
            line-height: 1.45;
            color: #bdbdc6;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-left: 3px solid rgb(var(--accent));
        }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menuWrapper">
        <div class="menu-container">
            <div class="menu-banner-wrapper">
                <div class="menu-banner"></div>
                <div class="banner-grain"></div>
                <div class="banner-title">
                    Bron Service
                    <small>Sunucu Kontrol Paneli</small>
                </div>
            </div>

            <div class="banner-scanline"></div>

            <div class="menu-category-box">
                <div class="category-btn" id="categoryTitle">Main Menu</div>
            </div>

            <div class="menu-viewport" id="menuViewport">
                <div class="menu-items" id="menuList"></div>
            </div>

            <div class="menu-footer">
                <div class="footer-row">
                    <div class="footer-brand">
                        <div class="footer-logo">B</div>
                        <span>Bron Service</span>
                    </div>
                    <div class="footer-counter"><span id="currentIndex">1</span> / <span id="totalIndex">9</span></div>
                </div>
                <div class="footer-row">
                    <div class="footer-breadcrumb" id="breadcrumb">Main</div>
                    <div class="footer-hint"><kbd>Backspace</kbd> geri &nbsp;<kbd>Enter</kbd> seç &nbsp;<kbd>Home</kbd> min &nbsp;<kbd>End</kbd> max</div>
                </div>
            </div>
        </div>

        <div class="menu-description" id="menuDesc">
            Interact with nearby players
        </div>
    </div>

    <div class="list-overlay" id="playerListOverlay">
        <div class="list-header">Oyuncu Listesi</div>
        <div class="list-body" id="playerListBody">
            <div class="player-entry" id="playerEntryTpl" hidden></div>
            <div class="player-empty" id="playerEmpty" hidden>Oyuncu bulunamadı</div>
        </div>
    </div>

    <div class="input-overlay" id="tpOverlay">
        <div class="input-box">
            <h3>Koordinata Işınlan</h3>
            <div class="input-row">
                <label>X<input type="number" id="tpX" step="any" value="0"></label>
                <label>Y<input type="number" id="tpY" step="any" value="0"></label>
                <label>Z<input type="number" id="tpZ" step="any" value="0"></label>
            </div>
            <div class="input-actions">
                <button type="button" class="btn" id="tpCancel">İptal</button>
                <button type="button" class="btn primary" id="tpSubmit">Teleport</button>
            </div>
        </div>
    </div>

    <div class="input-overlay" id="keybindOverlay">
        <div class="input-box">
            <h3>Menü Tuşu</h3>
            <p>Yeni tuşa bas...</p>
            <div class="input-actions">
                <button type="button" class="btn" id="kbCancel">İptal</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ---------- NUI ----------
        const resourceName = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'bronmenu';

        function post(name, data = {}) {
            return fetch(`https://${resourceName}/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify(data)
            }).then(r => r.json()).catch((err) => {
                console.warn('[nui] post failed', name, err);
            });
        }

        // ---------- Menü Verisi ----------
        const menuStructure = {
            title: "Main Menu",
            items: [
                { id: "cat_self", label: "Self", desc: "Karakter kişisel ayarları ve yönetimi.", icon: "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z", sub: [
                    { id: "self_revive", label: "Revive", desc: "Karakterinizi anında diriltir.", type: "button" },
                    { id: "self_godmode", label: "Godmode", desc: "Ölümsüzlük modunu açar/kapatır.", type: "checkbox", checked: false, default: false },
                    { id: "self_noclip", label: "Noclip", desc: "Serbest uçuş modunu açar.", type: "checkbox", checked: false, default: false },

                    { id: "tp_fbi", label: "FBI", desc: "FBI binasına ışınlanır.", type: "button" }
                ]},
                { id: "cat_settings", label: "Settings", desc: "Menü kısayolları ve ayarlar.", icon: "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z", sub: [
                    { id: "settings_keybind", label: "Menu Keybind", desc: "Menü tuşunu değiştirir.", type: "button" },
                    { id: "settings_scale", label: "Menu Scale", desc: "Menü boyutu.", type: "slider", min: 80, max: 120, value: 100, step: 5, default: 100 },
                    { id: "settings_opacity", label: "Menu Opacity", desc: "Menü saydamlığı.", type: "slider", min: 50, max: 100, value: 92, step: 1, default: 92 },
                    { id: "settings_accent", label: "Accent Color", desc: "Menü vurgu rengi.", type: "colorpicker", value: "#00ff78", default: "#00ff78" },
                    { id: "settings_sound", label: "Toggle Sound", desc: "Menü seslerini açar/kapatır.", type: "checkbox", checked: true, default: true },
                    { id: "settings_save", label: "Save Config", desc: "Ayarları kaydeder.", type: "button" },
                    { id: "settings_load", label: "Load Config", desc: "Kayıtlı ayarları yükler.", type: "button" },
                    { id: "settings_reset", label: "Reset Config", desc: "Ayarları sıfırlar.", type: "button" },
                    { id: "settings_unload", label: "Unload Menu", desc: "Menüyü kapatır.", type: "button" }
                ]}
            ]
        };

        // id -> item haritası (hızlı erişim için)
        const ITEM_MAP = {};
        function buildItemMap(items) {
            items.forEach(it => {
                if (it.id) ITEM_MAP[it.id] = it;
                if (it.sub) buildItemMap(it.sub);
            });
        }
        buildItemMap(menuStructure.items);

        // ---------- Durum ----------
        let navigationStack = [menuStructure];
        let currentIndex = 0;
        let menuVisible = true;
        let colorOverlayEl = null;
        let selectedPlayerId = null;
        let keybindOpen = false;

        const wrapperEl = document.getElementById('menuWrapper');
        const viewportEl = document.getElementById('menuViewport');
        const menuListEl = document.getElementById('menuList');
        const categoryTitleEl = document.getElementById('categoryTitle');
        const currentIndexEl = document.getElementById('currentIndex');
        const totalIndexEl = document.getElementById('totalIndex');
        const menuDescEl = document.getElementById('menuDesc');
        const breadcrumbEl = document.getElementById('breadcrumb');
        const toastContainerEl = document.getElementById('toastContainer');

        const playerListEl = document.getElementById('playerListOverlay');
        const playerListBodyEl = document.getElementById('playerListBody');
        const playerEntryTpl = document.getElementById('playerEntryTpl');
        const playerEmptyEl = document.getElementById('playerEmpty');

        const tpOverlayEl = document.getElementById('tpOverlay');
        const tpXEl = document.getElementById('tpX');
        const tpYEl = document.getElementById('tpY');
        const tpZEl = document.getElementById('tpZ');

        const keybindOverlayEl = document.getElementById('keybindOverlay');

        let cursorEl = null;

        function currentMenu() {
            return navigationStack[navigationStack.length - 1];
        }

        function getItemH() {
            return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-h')) || 42;
        }

        function decimalsOf(step) {
            const s = String(step);
            return s.includes('.') ? s.split('.')[1].length : 0;
        }

        function fmtValue(item) {
            return Number(item.value).toFixed(decimalsOf(item.step));
        }

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        // ---------- Toast ----------
        function showToast(text, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = text;
            toastContainerEl.appendChild(el);
            setTimeout(() => {
                el.classList.add('out');
                setTimeout(() => el.remove(), 300);
            }, 1800);
        }

        // ---------- Görünüm ayarları ----------
        function setAccent(hex) {
            const { r, g, b } = hexToRgb(hex);
            document.documentElement.style.setProperty('--accent', `${r}, ${g}, ${b}`);
            document.documentElement.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.14)`);
        }

        function applySetting(item) {
            switch (item.id) {
                case 'settings_scale':
                    wrapperEl.style.transformOrigin = 'top left';
                    wrapperEl.style.transform = `scale(${item.value / 100})`;
                    break;
                case 'settings_opacity':
                    document.documentElement.style.setProperty('--panel-alpha', (item.value / 100).toFixed(2));
                    break;
                case 'settings_accent':
                    setAccent(item.value);
                    break;
            }
        }

        // ---------- Config (kaydet / yükle / sıfırla) ----------
        function collectState() {
            const s = {};
            Object.values(ITEM_MAP).forEach(it => {
                if (it.id && (it.type === 'checkbox' || it.type === 'slider' || it.type === 'colorpicker')) {
                    s[it.id] = it.type === 'checkbox' ? it.checked : it.value;
                }
            });
            return s;
        }

        function applyState(state) {
            Object.entries(state).forEach(([id, v]) => {
                const it = ITEM_MAP[id];
                if (!it) return;
                if (it.type === 'checkbox') it.checked = !!v;
                else it.value = v;
                if (it.id.startsWith('settings_')) applySetting(it);
            });
            renderMenu("slide-right");
        }

        // ---------- Render ----------
        function renderRight(item) {
            if (item.sub) {
                return `<span class="arrow">&rsaquo;</span>`;
            }
            switch (item.type) {
                case 'checkbox':
                    return `<span class="toggle-badge ${item.checked ? 'on' : ''}">${item.checked ? 'AÇIK' : 'KAPALI'}</span>`;
                case 'slider':
                    return `<span class="slider-value">◄ ${fmtValue(item)} ►</span>`;
                case 'colorpicker':
                    return `<span class="color-swatch" style="background:${item.value}"></span>`;
                default:
                    return '';
            }
        }

        function updateBreadcrumb() {
            const parts = navigationStack.map((m, i) => i === 0 ? 'Main' : m.title);
            breadcrumbEl.innerHTML = parts
                .map((p, i) => i === parts.length - 1 ? `<span class="cur">${p}</span>` : p)
                .join(' &gt; ');
        }

        function renderMenu(animClass = "slide-right") {
            const menu = currentMenu();
            categoryTitleEl.textContent = menu.title;
            const items = menu.items;

            totalIndexEl.textContent = items.length;
            if (currentIndex >= items.length) currentIndex = Math.max(0, items.length - 1);
            if (currentIndex < 0) currentIndex = 0;

            menuListEl.innerHTML = '';

            cursorEl = document.createElement('div');
            cursorEl.className = 'gliding-cursor';
            menuListEl.appendChild(cursorEl);

            items.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.dataset.id = item.id || '';

                const iconSvg = item.icon ? `<svg viewBox="0 0 24 24"><path d="${item.icon}"/></svg>` : '';

                div.innerHTML = `
                    <div class="menu-item-left">
                        ${iconSvg}
                        <span>${item.label}</span>
                    </div>
                    <span class="row-right">${renderRight(item)}</span>
                `;
                menuListEl.appendChild(div);
            });

            viewportEl.scrollTop = 0;
            updateCursor();
            updateBreadcrumb();

            menuListEl.classList.remove('slide-right', 'slide-left');
            void menuListEl.offsetWidth;
            menuListEl.classList.add(animClass);
        }

        function updateRow(item) {
            if (!item || !item.id) return;
            const row = menuListEl.querySelector(`.menu-item[data-id="${item.id}"]`);
            if (!row) return;
            row.querySelector('.row-right').innerHTML = renderRight(item);
        }

        function ensureVisible() {
            const itemH = getItemH();
            const top = currentIndex * itemH;
            const bottom = top + itemH;
            if (top < viewportEl.scrollTop) {
                viewportEl.scrollTop = top;
            } else if (bottom > viewportEl.scrollTop + viewportEl.clientHeight) {
                viewportEl.scrollTop = bottom - viewportEl.clientHeight;
            }
        }

        function updateCursor() {
            const rows = menuListEl.querySelectorAll('.menu-item');
            rows.forEach((el, index) => {
                el.classList.toggle('active', index === currentIndex);
            });

            if (cursorEl) {
                cursorEl.style.transform = `translateY(${currentIndex * getItemH()}px)`;
            }

            ensureVisible();

            const items = currentMenu().items;
            if (items[currentIndex]) {
                menuDescEl.textContent = items[currentIndex].desc || "Açıklama bulunmuyor.";
                currentIndexEl.textContent = currentIndex + 1;
            }
        }

        // ---------- Slider ----------
        function setSliderValue(item, v) {
            const decimals = decimalsOf(item.step);
            v = Math.min(item.max, Math.max(item.min, v));
            v = Number(v.toFixed(decimals));
            if (v === item.value) return;

            item.value = v;
            updateRow(item);
            if (item.id?.startsWith('settings_')) applySetting(item);
            post('action', { id: item.id, label: item.label, value: item.value });
        }

        // ---------- Renk seçici ----------
        function closeColorOverlay() {
            if (colorOverlayEl) {
                colorOverlayEl.remove();
                colorOverlayEl = null;
            }
        }

        function openColorPicker(item) {
            closeColorOverlay();

            colorOverlayEl = document.createElement('div');
            colorOverlayEl.className = 'color-overlay';

            const input = document.createElement('input');
            input.type = 'color';
            input.value = item.value;

            input.addEventListener('input', () => {
                item.value = input.value;
                updateRow(item);
                if (item.id === 'settings_accent') setAccent(item.value);
            });

            input.addEventListener('change', () => {
                item.value = input.value;
                updateRow(item);
                if (item.id === 'settings_accent') setAccent(item.value);
                post('action', { id: item.id, label: item.label, value: item.value });
                closeColorOverlay();
            });

            colorOverlayEl.addEventListener('click', (e) => {
                if (e.target === colorOverlayEl) closeColorOverlay();
            });

            colorOverlayEl.appendChild(input);
            document.body.appendChild(colorOverlayEl);
            input.focus();
            input.click();
        }

        // ---------- Oyuncu listesi overlay ----------
        let playerListOpen = false;

        function positionPlayerList() {
            const rect = wrapperEl.getBoundingClientRect();
            playerListEl.style.left = `${rect.right + 12}px`;
            playerListEl.style.top = `${rect.top}px`;
        }

        function openPlayerList() {
            positionPlayerList();
            playerListEl.classList.add('open');
            playerListOpen = true;
            post('requestPlayerList', {});
        }

        function closePlayerList() {
            playerListEl.classList.remove('open');
            playerListOpen = false;
        }

        function selectPlayerRow(el, pid) {
            selectedPlayerId = pid;
            playerListBodyEl.querySelectorAll('.player-entry').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            post('selectPlayer', { id: pid });
        }

        function renderPlayerList(players) {
            playerListBodyEl.querySelectorAll('.player-entry:not([hidden])').forEach(el => el.remove());
            playerEmptyEl.hidden = players.length > 0;

            players.forEach(p => {
                const el = playerEntryTpl.cloneNode(true);
                el.removeAttribute('hidden');
                el.removeAttribute('id');
                el.dataset.pid = p.id;

                const left = document.createElement('span');
                const idSpan = document.createElement('span');
                idSpan.className = 'pid';
                idSpan.textContent = p.id;
                left.appendChild(idSpan);
                left.appendChild(document.createTextNode(p.name ?? ''));

                const right = document.createElement('span');
                right.className = 'pdist';
                right.textContent = typeof p.dist === 'number' ? `${p.dist.toFixed(1)}m` : (p.dist ?? '');

                el.append(left, right);

                if (p.id === selectedPlayerId) el.classList.add('selected');

                el.addEventListener('click', () => selectPlayerRow(el, p.id));

                playerListBodyEl.appendChild(el);
            });

            // Seçili oyuncu artık listede değilse seçimi temizle
            if (selectedPlayerId !== null && !players.some(p => p.id === selectedPlayerId)) {
                selectedPlayerId = null;
                post('selectPlayer', { id: null });
            }
        }

        // ---------- Koordinat overlay ----------
        function openTpOverlay() {
            tpOverlayEl.classList.add('open');
            tpXEl.focus();
        }

        function closeTpOverlay() {
            tpOverlayEl.classList.remove('open');
        }

        function submitTp() {
            const x = parseFloat(tpXEl.value);
            const y = parseFloat(tpYEl.value);
            const z = parseFloat(tpZEl.value);
            if ([x, y, z].some(Number.isNaN)) {
                showToast('Geçersiz koordinat', 'off');
                return;
            }
            post('action', { id: 'misc_tp_coords', value: { x, y, z } });
            closeTpOverlay();
        }

        [tpXEl, tpYEl, tpZEl].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitTp();
                }
            });
        });

        document.getElementById('tpSubmit').addEventListener('click', submitTp);
        document.getElementById('tpCancel').addEventListener('click', closeTpOverlay);
        tpOverlayEl.addEventListener('click', (e) => {
            if (e.target === tpOverlayEl) closeTpOverlay();
        });

        // ---------- Menü tuşu (keybind) overlay ----------
        function openKeybindOverlay() {
            keybindOverlayEl.classList.add('open');
            keybindOpen = true;
        }

        function closeKeybindOverlay() {
            keybindOverlayEl.classList.remove('open');
            keybindOpen = false;
        }

        document.getElementById('kbCancel').addEventListener('click', closeKeybindOverlay);

        // ---------- Overlay yönetimi ----------
        function closeTopOverlay() {
            if (keybindOpen) { closeKeybindOverlay(); return true; }
            if (colorOverlayEl) { closeColorOverlay(); return true; }
            if (tpOverlayEl.classList.contains('open')) { closeTpOverlay(); return true; }
            if (playerListOpen) { closePlayerList(); return true; }
            return false;
        }

        function closeAllOverlays() {
            closeColorOverlay();
            closeTpOverlay();
            closePlayerList();
            closeKeybindOverlay();
        }

        function setMenuVisible(state) {
            menuVisible = state;
            wrapperEl.classList.toggle('hidden', !state);
            if (!state) closeAllOverlays();
        }

        // ---------- Buton aksiyonları ----------
        function handleButton(item) {
            if (item.id === 'settings_unload') {
                closeAllOverlays();
                setMenuVisible(false);
                post('close', {});
                post('action', { id: item.id, label: item.label });
                return;
            }

            if (item.id === 'settings_keybind') {
                openKeybindOverlay();
                return;
            }

            if (item.id === 'settings_save') {
                post('saveConfig', { state: collectState() });
                return;
            }

            if (item.id === 'settings_load') {
                post('loadConfig', {});
                return;
            }

            if (item.id === 'settings_reset') {
                Object.values(ITEM_MAP).forEach(it => {
                    if (it.default !== undefined) {
                        if (it.type === 'checkbox') it.checked = it.default;
                        else if (it.type === 'slider' || it.type === 'colorpicker') it.value = it.default;
                    }
                });
                renderMenu("slide-right");
                indexItems();
                post('action', { id: 'settings_reset' });
                return;
            }

            if (item.id === 'online_player_list') {
                if (playerListOpen) {
                    closePlayerList();
                } else {
                    openPlayerList();
                }
                post('action', { id: item.id, label: item.label });
                return;
            }

            if (item.id.startsWith('troll_')) {
                if (selectedPlayerId === null) {
                    showToast('Önce oyuncu seç', 'off');
                    return;
                }
                post('action', { id: item.id, label: item.label, target: selectedPlayerId });
                showToast(`${item.label} tetiklendi`, 'info');
                return;
            }

            if (item.id.startsWith('online_')) {
                if (selectedPlayerId === null) {
                    showToast('Önce oyuncu seç', 'off');
                    return;
                }
                post('action', { id: item.id, label: item.label, target: selectedPlayerId });
                showToast(`${item.label} tetiklendi`, 'info');
                return;
            }

            if (item.id === 'misc_tp_coords') {
                openTpOverlay();
                return;
            }

            post('action', { id: item.id, label: item.label });
            showToast(`${item.label} tetiklendi`, 'info');
        }

        // ---------- NUI mesajları (Lua'dan) ----------
        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || !d.action) return;

            switch (d.action) {
                case 'toggleMenu':
                    setMenuVisible(!!d.state);
                    break;
                case 'updatePlayerList':
                    renderPlayerList(d.players || []);
                    break;
                case 'applyConfig':
                    applyState(d.state || {});
                    break;
            }
        });

        // ---------- Klavye ----------
        window.addEventListener('keydown', (e) => {
            // Menü tuşu dinleme modu: Escape iptal, diğer tuş kaydedilir
            if (keybindOpen) {
                e.preventDefault();
                if (e.key !== 'Escape') {
                    post('setKeybind', { key: e.key });
                }
                closeKeybindOverlay();
                return;
            }

            if (e.key === 'Escape') {
                if (closeTopOverlay()) e.preventDefault();
                return;
            }

            const t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

            if (!menuVisible || colorOverlayEl) return;

            // Player list açıkken menü navigasyonu ve Enter yutulur
            if (playerListOpen && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter')) {
                e.preventDefault();
                return;
            }

            const items = currentMenu().items;
            const selected = items[currentIndex];
            const isSlider = selected && selected.type === 'slider';
            const step = isSlider ? selected.step * (e.shiftKey ? 10 : 1) : 0;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % items.length;
                updateCursor();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateCursor();
            } else if (e.key === 'ArrowLeft') {
                if (isSlider) {
                    e.preventDefault();
                    setSliderValue(selected, selected.value - step);
                }
            } else if (e.key === 'ArrowRight') {
                if (isSlider) {
                    e.preventDefault();
                    setSliderValue(selected, selected.value + step);
                }
            } else if (e.key === 'Home') {
                if (isSlider) {
                    e.preventDefault();
                    setSliderValue(selected, selected.min);
                }
            } else if (e.key === 'End') {
                if (isSlider) {
                    e.preventDefault();
                    setSliderValue(selected, selected.max);
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (!selected) return;

                if (selected.sub) {
                    navigationStack.push({ title: selected.label, items: selected.sub });
                    currentIndex = 0;
                    renderMenu("slide-right");
                } else if (selected.type === 'checkbox') {
                    if (selected.id === 'online_spectate' && selectedPlayerId === null) {
                        showToast('Önce oyuncu seç', 'off');
                        return;
                    }
                    selected.checked = !selected.checked;
                    updateRow(selected);
                    post('action', { id: selected.id, label: selected.label, value: selected.checked });
                    showToast(`${selected.label}: ${selected.checked ? 'AÇIK' : 'KAPALI'}`, selected.checked ? 'on' : 'off');
                } else if (selected.type === 'button') {
                    handleButton(selected);
                } else if (selected.type === 'colorpicker') {
                    openColorPicker(selected);
                }
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                if (playerListOpen) {
                    closePlayerList();
                    return;
                }
                if (navigationStack.length > 1) {
                    navigationStack.pop();
                    currentIndex = 0;
                    renderMenu("slide-left");
                }
            }
        });

        // Settings değerlerini başlangıçta uygula (tek seferlik)
        function indexItems() {
            Object.values(ITEM_MAP).forEach(item => {
                if (item.id && item.id.startsWith('settings_')) applySetting(item);
            });
        }

        indexItems();
        renderMenu("slide-right");
    </script>
</body>
</html>
