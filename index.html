<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEILD Menu - Image Link Banner</title>
    <style>
        :root {
            --menu-color: 0, 255, 120; /* Canlı Yeşil Tema */
            --bg-color: rgba(0, 0, 0, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 40px;
            overflow: hidden;
            color: #fff;
        }

        /* Genişletilmiş Menü Konteynerı */
        .menu-wrapper {
            position: relative;
            width: 420px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: menuSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes menuSlideIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .menu-container {
            width: 100%;
            background: var(--bg-color);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        /* En Üstteki Banner Alanı (Resim Linki Kullanımı) */
        .menu-banner-wrapper {
            width: 100%;
            height: 130px;
            overflow: hidden;
            position: relative;
            background: #111; 
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }

        .menu-banner {
            width: 100%;
            height: 100%;
            /* BURAYA İSTEDİĞİN RESİM LİNKİNİ YAPIŞTIRABİLİRSİN */
            background: url('https://media.discordapp.net/attachments/1563900451223502988/1563969902665015476/image.png?ex=6adf8ff9&is=6ade3e79&hm=c718da4c52081b773d091b4029b7e887a0587dbdb574e8f1c803abebd4ff0996&=&format=webp&quality=lossless') center/cover no-repeat;
            animation: bannerPulse 12s infinite alternate ease-in-out;
        }

        @keyframes bannerPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Kategori / Main Menu Butonu */
        .menu-category-box {
            padding: 10px 12px;
            background: #000;
        }

        .category-btn {
            display: inline-block;
            background: rgb(var(--menu-color));
            color: #000;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 4px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(var(--menu-color), 0.4);
        }

        /* Menü Viewport ve Sağa/Sola Geçiş Animasyonları */
        .menu-viewport {
            position: relative;
            overflow: hidden;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            padding: 6px 0;
            position: relative;
        }

        .slide-right {
            animation: slideRightAnim 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideRightAnim {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .slide-left {
            animation: slideLeftAnim 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideLeftAnim {
            0% { transform: translateX(-30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* GLIDING CURSOR (Akıcı Kayan Neon İmleç) */
        .gliding-cursor {
            position: absolute;
            left: 6px;
            width: calc(100% - 12px);
            height: 40px;
            background: rgba(0, 255, 120, 0.12);
            border: 1px solid rgb(var(--menu-color));
            border-radius: 4px;
            pointer-events: none;
            transition: transform 0.16s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1;
            box-shadow: 0 0 12px rgba(var(--menu-color), 0.5);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
            padding: 0 16px;
            font-size: 13.5px;
            color: #d1d1d1;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.15s ease;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.8;
            transition: opacity 0.15s ease;
        }

        .menu-item .arrow {
            font-size: 12px;
            color: #888;
            transition: transform 0.15s ease;
        }

        .menu-item.active {
            color: #ffffff;
            font-weight: 600;
        }

        .menu-item.active svg,
        .menu-item.active .arrow {
            color: rgb(var(--menu-color));
            opacity: 1;
            fill: rgb(var(--menu-color));
        }

        .menu-item.active .arrow {
            transform: translateX(3px);
        }

        /* Alt Footer Çubuğu */
        .menu-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
            padding: 0 16px;
            background: #000;
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: rgb(var(--menu-color));
            letter-spacing: 1px;
        }

        .footer-brand span {
            font-size: 15px;
        }

        .footer-counter {
            color: #aaa;
            font-size: 11.5px;
        }

        /* Açıklama Kutusu */
        .menu-description {
            margin-top: 6px;
            width: 100%;
            background: var(--bg-color);
            padding: 12px 16px;
            font-size: 12.5px;
            color: #ccc;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <div class="menu-container">
            <!-- En Üst Banner Alanı -->
            <div class="menu-banner-wrapper">
                <div class="menu-banner"></div>
            </div>

            <!-- Kategori / Başlık Alanı -->
            <div class="menu-category-box">
                <div class="category-btn" id="categoryTitle">Main Menu</div>
            </div>

            <!-- Liste Viewport -->
            <div class="menu-viewport">
                <div class="menu-items" id="menuList"></div>
            </div>

            <!-- Alt Footer -->
            <div class="menu-footer">
                <div class="footer-brand">
                    <span>V</span> VEILD
                </div>
                <div class="footer-counter"><span id="currentIndex">1</span>/<span id="totalIndex">8</span></div>
            </div>
        </div>

        <!-- Açıklama Alanı -->
        <div class="menu-description" id="menuDesc">
            Interact with nearby players
        </div>
    </div>

    <script>
        const menuStructure = {
            title: "Main Menu",
            items: [
                { label: "Self", desc: "Karakter kişisel ayarları ve yönetimi.", icon: "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z", sub: [
                    { label: "Revive", desc: "Karakterinizi anında diriltir.", type: "button" },
                    { label: "Godmode", desc: "Ölümsüzlük modunu açar/kapatır.", type: "checkbox", checked: false },
                    { label: "Noclip", desc: "Serbest uçuş modunu açar.", type: "checkbox", checked: false }
                ]},
                { label: "Online", desc: "Sunucudaki oyuncu listesi ve etkileşimler.", icon: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", sub: [
                    { label: "Player List", desc: "Aktif oyuncuları listele.", type: "button" },
                    { label: "Spectate", desc: "Seçilen oyuncuyu izle.", type: "checkbox", checked: false }
                ]},
                { label: "Vehicle", desc: "Araç spawn etme ve tamir işlemleri.", icon: "M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z", sub: [
                    { label: "Spawn Vehicle", desc: "İstediğin aracı çağır.", type: "button" },
                    { label: "Repair Vehicle", desc: "Aracı tamir et.", type: "button" }
                ]},
                { label: "Weapon", desc: "Silah ve mermi yönetimi.", icon: "M15.5 5.5l3 3-10 10H5.5v-3l10-10zm2.5-3l1.5 1.5-2 2-1.5-1.5 2-2zM3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z", sub: [
                    { label: "Infinite Ammo", desc: "Sınırsız mermi.", type: "checkbox", checked: false }
                ]},
                { label: "Visuals", desc: "Görsel ayarlar ve ESP.", icon: "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" },
                { label: "Misc", desc: "Çeşitli ekstra araçlar.", icon: "M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.03 2.18 13.82 2 13.6 2h-4c-.22 0-.42.18-.45.39l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.22.23.39.45.39h4c.22 0 .42-.18.45-.39l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z" },
                { label: "Settings", desc: "Menü kısayolları ve ayarlar.", icon: "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" },
                { label: "Search", desc: "Öğe arama motoru.", icon: "M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" }
            ]
        };

        let navigationStack = [menuStructure];
        let currentIndex = 0;

        const menuListEl = document.getElementById('menuList');
        const categoryTitleEl = document.getElementById('categoryTitle');
        const currentIndexEl = document.getElementById('currentIndex');
        const totalIndexEl = document.getElementById('totalIndex');
        const menuDescEl = document.getElementById('menuDesc');

        let cursorEl = null;

        function renderMenu(animClass = "slide-right") {
            const currentMenu = navigationStack[navigationStack.length - 1];
            categoryTitleEl.textContent = currentMenu.title;
            const items = currentMenu.items;

            totalIndexEl.textContent = items.length;
            if (currentIndex >= items.length) currentIndex = Math.max(0, items.length - 1);
            if (currentIndex < 0) currentIndex = 0;
            currentIndexEl.textContent = currentIndex + 1;

            menuListEl.innerHTML = '';

            cursorEl = document.createElement('div');
            cursorEl.className = 'gliding-cursor';
            menuListEl.appendChild(cursorEl);

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `menu-item ${index === currentIndex ? 'active' : ''}`;
                
                let iconSvg = item.icon ? `<svg viewBox="0 0 24 24">${item.icon}</svg>` : '';
                let rightContent = item.sub ? `<span class="arrow">&gt;</span>` : (item.type === "checkbox" ? `<span style="font-size:11px; color:${item.checked ? '#00ff78' : '#888'}">${item.checked ? '[AÇIK]' : '[KAPALI]'}</span>` : '');

                div.innerHTML = `
                    <div class="menu-item-left">
                        ${iconSvg}
                        <span>${item.label}</span>
                    </div>
                    ${rightContent}
                `;
                menuListEl.appendChild(div);
            });

            updateCursor();

            menuListEl.classList.remove('slide-right', 'slide-left');
            void menuListEl.offsetWidth;
            menuListEl.classList.add(animClass);
        }

        function updateCursor() {
            const items = menuListEl.querySelectorAll('.menu-item');
            items.forEach((el, index) => {
                if (index === currentIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            if (cursorEl) {
                cursorEl.style.transform = `translateY(${currentIndex * 40}px)`;
            }

            const currentMenu = navigationStack[navigationStack.length - 1];
            if (currentMenu.items[currentIndex]) {
                menuDescEl.textContent = currentMenu.items[currentIndex].desc || "Açıklama bulunmuyor.";
                currentIndexEl.textContent = currentIndex + 1;
            }
        }

        window.addEventListener('keydown', (e) => {
            const currentMenu = navigationStack[navigationStack.length - 1];
            const items = currentMenu.items;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % items.length;
                updateCursor();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateCursor();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const selected = items[currentIndex];
                if (selected && selected.sub) {
                    navigationStack.push({
                        title: selected.label,
                        items: selected.sub
                    });
                    currentIndex = 0;
                    renderMenu("slide-right");
                } else if (selected && selected.type === "checkbox") {
                    selected.checked = !selected.checked;
                    updateCursor();
                }
            } else if (e.key === 'Backspace' || e.key === 'Escape') {
                e.preventDefault();
                if (navigationStack.length > 1) {
                    navigationStack.pop();
                    currentIndex = 0;
                    renderMenu("slide-left");
                }
            }
        });

        renderMenu("slide-right");
    </script>
</body>
</html>
